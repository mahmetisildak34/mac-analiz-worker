name: Cloudflare Worker Preview

on:
  push:
    branches:
      - feature/isolated-history-backfill-queue
    paths:
      - "worker.js"
      - "history-backfill.js"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/preview-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker.js"
      - "history-backfill.js"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/preview-worker.yml"

permissions:
  contents: read

jobs:
  preview:
    # Never expose Cloudflare credentials to a pull request from a fork.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create or update isolated Cloudflare Preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler preview --name feature-isolated-history-backfill-queue --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Probe Preview root without changing data
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$PREVIEW_URL/" | tee /tmp/preview-root.json
          grep -q '"ok":true' /tmp/preview-root.json
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Probe isolated staging status (read-only)
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$PREVIEW_URL/api/archive/history-backfill/pilot-status"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Audit historical queues without mutation
        run: |
          set -euo pipefail
          echo "Nations League fixture queue:"
          fixture_state="$(curl --fail --show-error --silent "$PREVIEW_URL/api/archive/history-backfill/status?scope=nations-league")"
          printf '%s\n' "$fixture_state"
          echo "$fixture_state" | jq -e '.ok == true and .executionEnabled == false' >/dev/null
          echo "Nations League statistics queue:"
          stats_state="$(curl --fail --show-error --silent "$PREVIEW_URL/api/archive/nations-league/statistics-status")"
          printf '%s\n' "$stats_state"
          echo "$stats_state" | jq -e '.ok == true and .executionEnabled == false' >/dev/null
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Initialize isolated Nations League queue metadata (Preview only)
        run: |
          set -euo pipefail
          code="$(curl --show-error --silent --output /tmp/queue-init.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/api/archive/history-backfill/start?scope=nations-league")"
          cat /tmp/queue-init.json
          if [ "$code" = "201" ]; then
            jq -e '.ok == true and .created == true and .executionEnabled == false' /tmp/queue-init.json >/dev/null
          elif [ "$code" = "409" ]; then
            jq -e '.alreadyExists == true' /tmp/queue-init.json >/dev/null
          else
            echo "Unexpected queue initialization HTTP status: $code" >&2
            exit 1
          fi
          status="$(curl --fail --show-error --silent "$PREVIEW_URL/api/archive/history-backfill/status?scope=nations-league")"
          printf '%s\n' "$status"
          echo "$status" | jq -e '.ok == true and .exists == true and .executionEnabled == false and .totalJobs == 1839' >/dev/null
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Probe historical Nations League coverage (read-only)
        run: |
          set -euo pipefail
          probe="$(curl --show-error --silent "$PREVIEW_URL/api/archive/history-backfill/probe?league=uefa.nations&from=20240905&to=20240905")"
          printf '%s\n' "$probe"
          echo "$probe" | jq -e '.status != null' >/dev/null
          echo "$probe" | jq -e '.ok == true and .status == "range-supported-response"' >/dev/null
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Inspect one historical Nations League summary (read-only)
        run: |
          set -euo pipefail
          summary="$(curl --show-error --silent "$PREVIEW_URL/api/espn/uefa.nations/summary?event=698882")"
          echo "$summary" | jq '{event: .header.competitions[0].id, boxscoreTeams: (.boxscore.teams // [] | length), teams: [(.boxscore.teams // [])[] | {homeAway, team: (.team.displayName // .team.name), statisticsCount: ((.statistics // []) | length)}]}'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Publish Preview URL
        run: |
          {
            echo "## Cloudflare Worker Preview"
            echo
            echo "Preview URL: $PREVIEW_URL"
            echo
            echo "Only the Preview deployment was updated. Production deployment and live data were not changed."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
