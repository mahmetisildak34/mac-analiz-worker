name: Priority League Data Audit

on:
  schedule:
    - cron: "10 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit D1 archive against ESPN team directories and upcoming fixtures
        run: node scripts/priority-league-audit.mjs
