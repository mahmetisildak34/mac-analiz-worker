name: Isolated D1 credential and write permission preflight
on:
  push:
    branches: [fix/verified-statistics-gap-audit-20261122]
    paths: ['.github/workflows/isolated-d1-credential-preflight.yml']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ISOLATED_D1_ONLY to allow a harmless write probe'
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolated-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ISOLATED_D1_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '640bfb6a538ee57864281941b14dbc55'
      D1_DATABASE_ID: 'fb9b42cc-8d96-4911-b193-0983527ee593'
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Verify GitHub secret exists without exposing its value
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Dedicated isolated D1 token secret is not configured for this workflow'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Dedicated isolated D1 token secret is configured (value withheld)'
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check isolated D1 read permission without mutations
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT name FROM sqlite_master WHERE type=\u0027table\u0027 LIMIT 1"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('response.json'));console.log(JSON.stringify({httpStatus:process.argv[1],success:x.success,errorCodes:(x.errors||[]).map(e=>e.code)}));if(!x.success)process.exitCode=1" "$status"
          rm -f response.json
      - name: Isolated-only D1 write permission probe
        if: steps.credentials.outputs.available == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'ISOLATED_D1_ONLY'))
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"sql":"CREATE TABLE IF NOT EXISTS mam_isolated_write_permission_probe (id INTEGER PRIMARY KEY)"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('response.json'));console.log(JSON.stringify({httpStatus:process.argv[1],success:x.success,errorCodes:(x.errors||[]).map(e=>e.code)}));if(!x.success)process.exitCode=1" "$status"
          rm -f response.json
