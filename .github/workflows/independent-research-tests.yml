name: Independent research regression tests
on:
  push:
    branches:
      - feature/independent-calibration-20261122
      - feature/independent-calibration-isolation-fix-20261122
  pull_request:
    branches:
      - feature/independent-calibration-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker module syntax (offline only)
        run: |
          node --check worker.js
          node --check statistics-repair-bulk.js
          node --check statistics-data-quality.js
          node --check trusted-goal-poisson.js
          node --check archive-poisson-client.js
          node --check statistics-repair.js
          node --check statistics-api-backfill.js
          node --check statistics-api-cron.js
          node --check statistics-api-persistence.js
      - name: Run independent research tests
        run: node --experimental-sqlite --test research/calibration-metrics.test.mjs research/verified-source-fallback.test.mjs research/request-coordinator.test.mjs research/run-paired-backtest.test.mjs research/chronological-holdout.test.mjs research/league-backtest.test.mjs research/verified-espn-audit.test.mjs research/poisson-v14.test.mjs research/prediction-provenance.test.mjs research/isolated-prediction-ledger.test.mjs research/concurrent-safety.test.mjs research/isolated-prediction-store.test.mjs research/replay-isolated-predictions.test.mjs research/isolated-d1-adapter.test.mjs research/evidence-reliability.test.mjs research/supplementary-market-evidence.test.mjs research/espn-pre-match-admission.test.mjs research/espn-admission-cli.test.mjs research/independent-espn-final.test.mjs research/verified-model-comparison.test.mjs research/verified-league-calibration.test.mjs research/capture-public-espn.test.mjs
      - name: Benchmark offline request coordination
        run: node --expose-gc research/benchmark-coordinator.mjs
      - name: Run offline Worker regression tests (no production bindings)
        run: node --test tests/*.test.mjs
      - name: Capture public ESPN scoreboards for all configured leagues (read-only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: node research/capture-public-espn.mjs research/espn-captures
      - name: Upload raw ESPN capture and admission evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: independent-espn-pre-match-capture
          path: research/espn-captures
          if-no-files-found: warn
          retention-days: 7
