name: Isolated statistics verification (offline)
on:
  push:
    branches:
      - fix/verified-statistics-gap-audit-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated repair syntax
        run: |
          node --check verified-statistics-candidate.js
          node --check isolated-verified-statistics-repair.js
          node --check statistics-data-quality.js
          node --check isolated-provider-fetch.js
      - name: Run all offline research regressions (Poisson, sources, concurrency)
        run: node --experimental-sqlite --test research/*.test.mjs
      - name: Benchmark offline request coordination
        run: node --expose-gc research/benchmark-coordinator.mjs
      - name: Run complete offline Worker regression suite
        run: node --experimental-sqlite --test tests/*.test.mjs
      - name: Run offline isolated repair and audit regressions
        run: node --experimental-sqlite --test research/statistics-gap-readonly-audit.test.mjs tests/verified-statistics-candidate.test.mjs tests/isolated-verified-statistics-repair.test.mjs tests/isolated-provider-fetch.test.mjs tests/isolated-statistics-sqlite-acceptance.test.mjs
