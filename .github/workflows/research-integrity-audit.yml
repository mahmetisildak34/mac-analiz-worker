name: Research integrity and resume audit
on:
  push:
    branches:
      - feature/bulk-statistics-repair-hardening
    paths:
      - "scripts/statistics-research-audit.mjs"
      - "STATISTICS_REPAIR_*_2026-11-21.json"
      - ".github/workflows/research-integrity-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: node --check scripts/statistics-research-audit.mjs
      - name: Verify plan, protected records, SHA-256, and research resume queue
        run: node scripts/statistics-research-audit.mjs > research-audit-report.json
      - name: Exercise isolated archive repair transactions
        run: python3 tests/archive-repair-local-acceptance.py
      - name: Print summary without publishing protected payloads
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync("research-audit-report.json","utf8")); console.log(JSON.stringify({plan_rows:r.plan_rows,unique_namespaced_fixtures:r.unique_namespaced_fixtures,unique_raw_fixture_ids:r.unique_raw_fixture_ids,manifest_sha256_checked:r.manifest_sha256_checked,counts:r.counts,next_pending:r.next_pending},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: research-integrity-resume-report
          path: research-audit-report.json
          retention-days: 14
