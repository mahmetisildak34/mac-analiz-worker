name: Deploy Cloudflare Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker.js"
      - "statistics-repair.js"
      - "statistics-api-backfill.js"
      - "statistics-api-persistence.js"
      - "statistics-api-cron.js"
      - "staging/**"
      - "wrangler.jsonc"
      - "package.json"
      - "tests/**/*.mjs"
      - ".github/workflows/deploy-worker.yml"
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - "tests/**/*.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker JavaScript syntax
        run: node --check worker.js

      - name: Run trusted goal Poisson tests
        run: node tests/trusted-goal-poisson.test.mjs

      - name: Verify experimental market metrics
        run: node --test tests/poisson-market-metrics.test.mjs

      - name: Verify model selection and conflict acceptance
        run: node --test tests/poisson-acceptance.test.mjs

      - name: Verify mobile archive Poisson integration
        run: node --test tests/archive-poisson-mobile.test.mjs

      - name: Check pinned offline integration checksums
        run: sha256sum -c docs/poisson-integration.sha256

      - name: Verify archive evidence and Poisson integration
        run: node tests/archive-evidence-integration.test.mjs

      - name: Verify offline analysis scenarios
        run: node tests/offline-analysis-fixture-client.test.mjs

      - name: Verify UEFA fixture import UTC and source evidence
        run: node tests/uefa-fixture-import.test.mjs

      - name: Verify isolated Cloudflare read-only bindings
        run: node tests/statistics-cloudflare-readonly.test.mjs

      - name: Verify API cron is disabled without quota audit
        run: node tests/statistics-api-cron.test.mjs

      - name: Run safe API persistence integration test
        run: node tests/statistics-api-persistence.test.mjs

      - name: Run gated API backfill policy test
        run: node tests/statistics-api-backfill.test.mjs

      - name: Run production-preview D1 integration test
        run: node tests/statistics-preview-integration.test.mjs

      - name: Run statistics repair safety test
        run: node tests/statistics-repair-safety.test.mjs

      - name: Run archive upsert regression test
        run: node tests/archive-upsert-guard.test.mjs

      - name: Run cross-source matching regression test
        run: node tests/cross-source-enrichment.test.mjs
      - name: Run cross-source side-aware matching regression test
        run: node tests/cross-source-side-matching.test.mjs

      - name: Run statistics overwrite guard regression test
        run: node tests/summary-statistics-overwrite-guard.test.mjs

      - name: Run D1 status cache optimization regression test
        run: node tests/d1-status-cache-optimization.test.mjs

      - name: Run cross-source D1 quota backoff regression test
        run: node tests/cross-source-quota-backoff.test.mjs

      - name: Run sync-status D1 read-quota regression test
        run: node tests/sync-status-d1-read-quota.test.mjs
      - name: Run D1 bounded-read regression test
        run: node tests/d1-read-bounds.test.mjs

      - name: Run archive upcoming KV cache regression test
        run: node tests/archive-upcoming-cache.test.mjs

      - name: Run archive live KV cache regression test
        run: node tests/archive-live-cache.test.mjs

      - name: Run archive backfill batch-size regression test
        run: node tests/archive-backfill-batch-size.test.mjs
      - name: Run archive completion checkpoint regression test
        run: node tests/archive-completion-checkpoint.test.mjs

      - name: Run adaptive archive speed regression test
        run: node tests/adaptive-archive-speed.test.mjs

      - name: Run statistics during archive backfill regression test
        run: node tests/statistics-during-archive.test.mjs

      - name: Run statistics discovery during archive backfill regression test
        run: node tests/statistics-discovery-during-archive.test.mjs

      - name: Run ESPN Core team-statistics fallback regression test
        run: node tests/espn-core-statistics-fallback.test.mjs

      - name: Run actual statistics saved-count regression test
        run: node tests/statistics-save-report.test.mjs

      - name: Run ESPN summary backlog drain regression test
        run: node tests/espn-summary-backlog-drain.test.mjs

      - name: Run ESPN queue preservation regression test
        run: node tests/espn-queue-preservation.test.mjs
      - name: Run ESPN archive existing-date skip regression test
        run: node tests/espn-archive-existing-date-skip.test.mjs

      - name: Run team-name alias regression test
        run: node tests/team-name-aliases.test.mjs

      - name: Run Paris FC / PSG alias collision regression test
        run: node tests/paris-team-alias-collision.test.mjs

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker to Cloudflare
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "640bfb6a538ee57864281941b14dbc55"
