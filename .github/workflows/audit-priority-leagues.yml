name: Priority League Data Audit

on:
  schedule:
    - cron: "10 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit D1 archive against ESPN team directories and upcoming fixtures
        run: |
          node --input-type=module <<'NODE'
          import { evaluatePriorityLeagueCoverage } from './scripts/priority-league-audit.mjs';
          const endpoint = "https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/api/archive/quality-check?limit=20000";
          const response = await fetch(endpoint, { headers: { "Accept": "application/json" } });
          const raw = await response.text();
          if (!response.ok) throw new Error("Coverage audit HTTP " + response.status + ": " + raw.slice(0, 1200));
          const report = JSON.parse(raw);
          let syncStatus = null;
          try {
            const syncResponse = await fetch("https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/api/archive/sync-status", { headers: { "Accept": "application/json" } });
            if (syncResponse.ok) syncStatus = await syncResponse.json();
          } catch (_) {}
          const leagues = Array.isArray(report.priorityLeagueCoverage) ? report.priorityLeagueCoverage : [];
          const { errors, incomplete } = evaluatePriorityLeagueCoverage(report);
          console.log("PRIORITY_LEAGUE_AUDIT=" + JSON.stringify({
            ranAt: new Date().toISOString(),
            totalRecords: report.totalRecords,
            checked: report.checked,
            truncated: report.truncated,
            invalidRecordCount: report.invalidRecordCount,
            completedWithoutScoreCount: report.completedWithoutScoreCount,
            invalidScoreCount: report.invalidScoreCount,
            syncStatus,
            leagues,
            directoryErrors: report.priorityLeagueDirectoryErrors,
            incompleteLeagueIds: incomplete,
            validationErrors: errors,
            incompleteLeagueCount: incomplete.length
          }, null, 2));
          if (errors.length || incomplete.length) {
            console.error("Coverage audit failed", { errors, incomplete });
            process.exitCode = 1;
          }
          NODE
