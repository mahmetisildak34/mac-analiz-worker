name: Validate Cloudflare Worker

on:
  pull_request:
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/validate-worker.yml"
  push:
    branches:
      - "fix/**"
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/validate-worker.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
