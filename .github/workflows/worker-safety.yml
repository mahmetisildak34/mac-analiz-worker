name: Worker safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/isolated-history-backfill-queue]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check worker.js
      - run: node --check history-backfill.js
      - run: node --test
      - name: Validate Wrangler config and Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run
      - name: Deploy isolated Worker Preview (feature branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/isolated-history-backfill-queue'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name mam-history-preview --message "Isolated historical archive Preview"
