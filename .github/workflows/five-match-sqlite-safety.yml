name: Five-match SQLite safety pilot (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-safety:
    name: Offline SQLite safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests (no Cloudflare credentials or deployment)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_five_match_sqlite_pilot.py' -v
