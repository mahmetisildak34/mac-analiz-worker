name: Start isolated staging Worker (manual only)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type STAGING_ONLY to deploy only mam-statistics-readonly-staging"
        required: true
        type: string
jobs:
  deploy-isolated-only:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'STAGING_ONLY'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned PR 69 development commit (not main)
        uses: actions/checkout@v4
        with:
          ref: c73be5d5f73b6b23fd9a311808ea435dec0b3921
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce isolated target and SELECT-only code
        shell: bash
        run: |
          set -euo pipefail
          node --check staging/read-only-worker.js
          node tests/statistics-cloudflare-readonly.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg = JSON.parse(fs.readFileSync('staging/wrangler.readonly.jsonc','utf8'));
          assert.equal(cfg.name,'mam-statistics-readonly-staging');
          assert.equal(cfg.main,'read-only-worker.js');
          assert.equal(cfg.workers_dev,false);
          assert.equal(cfg.triggers,undefined);
          assert.equal(cfg.routes,undefined);
          assert.equal(cfg.vars.STATISTICS_REPAIR_ENABLED,'false');
          assert.equal(cfg.vars.STATISTICS_API_BACKFILL_ENABLED,'false');
          assert.deepEqual(Object.fromEntries(cfg.d1_databases.map(d=>[d.binding,d.database_id])),{
            PRODUCTION_READ_DB:'b3103550-8f93-4109-8a24-e0095c49e666',
            PREVIEW_READ_DB:'704a5c24-491f-455f-b62a-23752083f085',
            TEST_WRITE_DB:'fb9b42cc-8d96-4911-b193-0983527ee593'
          });
          const source = fs.readFileSync('staging/read-only-worker.js','utf8');
          assert(!/\b(?:INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE|UPSERT|TRUNCATE)\b/i.test(source),'SQL write keyword forbidden');
          assert(!/\.\s*(?:run|batch|exec)\s*\(/.test(source),'D1 mutation method forbidden');
          assert(!/\b(?:await\s+fetch|globalThis\.fetch|env\.[A-Z_]*API)\s*\(/.test(source),'External API call forbidden');
          console.log('Isolated deployment safety gates passed');
          NODE
      - name: Check Cloudflare token is configured (without revealing value)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Cloudflare token secret is present; Workers write permission will be tested by isolated deployment."
      - name: Deploy only isolated staging Worker
        run: npx --yes wrangler@4 deploy --config staging/wrangler.readonly.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "640bfb6a538ee57864281941b14dbc55"
