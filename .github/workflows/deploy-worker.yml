name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker to Cloudflare
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "640bfb6a538ee57864281941b14dbc55"

      - name: Audit live priority league coverage
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/api/archive/quality-check?limit=20000";
          const response = await fetch(endpoint, { headers: { "Accept": "application/json" } });
          const raw = await response.text();
          if (!response.ok) throw new Error("Coverage audit HTTP " + response.status + ": " + raw.slice(0, 1200));
          const report = JSON.parse(raw);
          console.log("ARCHIVE_AUDIT_SUMMARY=" + JSON.stringify({
            ok: report.ok,
            totalRecords: report.totalRecords,
            checked: report.checked,
            invalidRecordCount: report.invalidRecordCount,
            completedWithoutScoreCount: report.completedWithoutScoreCount,
            invalidScoreCount: report.invalidScoreCount,
            priorityLeagueCoverage: report.priorityLeagueCoverage,
            priorityLeagueDirectoryErrors: report.priorityLeagueDirectoryErrors
          }, null, 2));
          NODE
