name: Independent research regression tests
on:
  push:
    branches:
      - feature/independent-calibration-20261122
      - feature/independent-calibration-isolation-fix-20261122
  pull_request:
    branches:
      - feature/independent-calibration-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker module syntax (offline only)
        run: |
          node --check worker.js
          node --check statistics-repair-bulk.js
          node --check statistics-data-quality.js
          node --check trusted-goal-poisson.js
          node --check archive-poisson-client.js
          node --check statistics-repair.js
          node --check statistics-api-backfill.js
          node --check statistics-api-cron.js
          node --check statistics-api-persistence.js
      - name: Run independent research tests
        run: node --experimental-sqlite --test research/calibration-metrics.test.mjs research/verified-source-fallback.test.mjs research/request-coordinator.test.mjs research/run-paired-backtest.test.mjs research/chronological-holdout.test.mjs research/league-backtest.test.mjs research/verified-espn-audit.test.mjs research/poisson-v14.test.mjs research/prediction-provenance.test.mjs research/isolated-prediction-ledger.test.mjs research/concurrent-safety.test.mjs research/isolated-prediction-store.test.mjs research/replay-isolated-predictions.test.mjs research/isolated-d1-adapter.test.mjs research/evidence-reliability.test.mjs
      - name: Run offline Worker regression tests (no production bindings)
        run: node --test tests/*.test.mjs
