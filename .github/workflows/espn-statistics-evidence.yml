name: ESPN completed match statistics evidence capture
on:
  push:
    branches: [fix/verified-statistics-gap-audit-20261122]
    paths:
      - 'research/espn-statistics-evidence.mjs'
      - 'research/espn-statistics-evidence.test.mjs'
      - '.github/workflows/espn-statistics-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-statistics-gap-audit-20261122
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate evidence parser
        run: node --test research/espn-statistics-evidence.test.mjs
      - name: Capture public ESPN scoreboards read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p espn-statistics-capture
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {normalizeCompletedEspnEvent} from './research/espn-statistics-evidence.mjs';
          const leagues=['tur.1','eng.1','esp.1','ger.1','ita.1','fra.1','uefa.champions','uefa.europa','ned.1','por.1','uefa.europa.conf','eng.2','esp.2','ger.2','ita.2','fra.2','bel.1','sco.1','usa.1','bra.1','arg.1','mex.1','jpn.1','aus.1','chn.1','ksa.1'];
          const capturedAt=new Date().toISOString(),records=[],report={capturedAt,source:'ESPN public scoreboard GET only',leagues:{}};
          for(const leagueId of leagues){
            try{const response=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/'+leagueId+'/scoreboard?limit=500',{headers:{accept:'application/json'},signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('HTTP '+response.status);const payload=await response.json();if(!Array.isArray(payload.events))throw new Error('events missing');let accepted=0;const rejected={};for(const event of payload.events){const result=normalizeCompletedEspnEvent(event,{leagueId,capturedAt});if(result.accepted){records.push(result.record);accepted++;}else rejected[result.reason]=(rejected[result.reason]??0)+1;}report.leagues[leagueId]={httpStatus:response.status,events:payload.events.length,accepted,rejected};}
            catch(error){report.leagues[leagueId]={error:String(error.message).slice(0,120)};}
          }
          const seen=new Set();for(const row of records){if(seen.has(row.fixture_id))throw new Error('Duplicate fixture across league scoreboards: '+row.fixture_id);seen.add(row.fixture_id);}
          await writeFile('espn-statistics-capture/verified-provider-statistics.json',JSON.stringify(records,null,2));
          await writeFile('espn-statistics-capture/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({leagues:Object.keys(report.leagues).length,accepted:records.length,byLeague:report.leagues},null,2));
          NODE
      - name: Upload immutable capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-statistics-evidence-\${{ github.run_id }}
          path: espn-statistics-capture/
          retention-days: 7
          if-no-files-found: error
